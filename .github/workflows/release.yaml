name: Release
env:
  NODE_VERSION: '22.X'
  RELEASE_TAR: 'gatekeeper-headlamp-plugin-${{ github.event.inputs.releaseVersion }}.tar.gz'

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (without v prefix)'
        required: true
        default: '0.0.0'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Require master branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Release workflow must be dispatched from master."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const packageJson = require('./package.json');
          const packageLock = require('./package-lock.json');
          const expectedVersion = process.env.RELEASE_VERSION;

          if (
            packageJson.version !== expectedVersion ||
            packageLock.version !== expectedVersion ||
            packageLock.packages?.['']?.version !== expectedVersion
          ) {
            throw new Error('Release version was not applied to package metadata');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format -- --check

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run tsc

      - name: Run tests
        run: npm test
        env:
          CI: 'true'

      - name: Validate plugin build
        run: make validate

      - name: Verify packaged version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          node -e "if (require('./.plugins/package.json').version !== process.env.RELEASE_VERSION) throw new Error('Packaged plugin version does not match release version')"

      - name: Create Archive
        run: |
          mkdir -p gatekeeper-headlamp-plugin
          cp .plugins/* gatekeeper-headlamp-plugin
          tar -czf "$RELEASE_TAR" gatekeeper-headlamp-plugin

      - name: Calculate Checksum
        id: checksum
        run: |
          checksum="$(sha256sum "$RELEASE_TAR" | cut -d' ' -f1)"
          echo "value=$checksum" >> "$GITHUB_OUTPUT"

      - name: Calculate Date
        id: date
        run: |
          echo "value=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Update artifacthub-pkg.yml
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          valueFile: artifacthub-pkg.yml
          changes: |
            {
              "version": "${{ github.event.inputs.releaseVersion }}",
              "createdAt": "${{ steps.date.outputs.value }}",
              "annotations[\"headlamp/plugin/archive-url\"]": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.releaseVersion }}/${{ env.RELEASE_TAR }}",
              "annotations[\"headlamp/plugin/archive-checksum\"]": "SHA256:${{ steps.checksum.outputs.value }}"
            }
          commitChange: false

      - name: Commit Changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          message: 'chore(release): ${{ github.event.inputs.releaseVersion }}'
          commit: --signoff
          add: |
            - artifacthub-pkg.yml
            - package.json
            - package-lock.json

      - name: Create Release Draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.releaseVersion }}
          prerelease: true
          files: ${{ env.RELEASE_TAR }}
          token: ${{ github.token }}
