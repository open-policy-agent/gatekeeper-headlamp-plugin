name: Release

env:
  NODE_VERSION: '22.X'

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (without v prefix)'
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish and verify release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Require master branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Release workflow must run against master."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release version
        id: release_version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          REQUESTED_VERSION: ${{ inputs.releaseVersion }}
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            release_version="$package_version"
          else
            release_version="$REQUESTED_VERSION"
          fi

          RELEASE_VERSION="$release_version" node <<'NODE'
          const version = process.env.RELEASE_VERSION;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (!semver.test(version)) {
            throw new Error(`Release version must be valid SemVer without a v prefix: ${version}`);
          }
          NODE

          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] && [ "$RELEASE_BRANCH" != "release/$release_version" ]; then
            echo "::error::Merged release branch $RELEASE_BRANCH does not match package version $release_version."
            exit 1
          fi

          release_tar="gatekeeper-headlamp-plugin-$release_version.tar.gz"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAR=$release_tar" >> "$GITHUB_ENV"
          echo "value=$release_version" >> "$GITHUB_OUTPUT"
          echo "archive=$release_tar" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        run: |
          node <<'NODE'
          const packageJson = require('./package.json');
          const packageLock = require('./package-lock.json');
          const expectedVersion = process.env.RELEASE_VERSION;

          if (
            packageJson.version !== expectedVersion ||
            packageLock.version !== expectedVersion ||
            packageLock.packages?.['']?.version !== expectedVersion
          ) {
            throw new Error('Release version does not match the package metadata on master');
          }
          NODE

          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION")"
          if [ -n "$remote_tag" ]; then
            git fetch --force origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_VERSION^{commit}")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_VERSION already points to $tag_commit, not $GITHUB_SHA."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format -- --check

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run tsc

      - name: Run tests
        run: npm test
        env:
          CI: 'true'

      - name: Validate plugin build
        run: make validate

      - name: Verify packaged version
        run: |
          node -e "if (require('./.plugins/package.json').version !== process.env.RELEASE_VERSION) throw new Error('Packaged plugin version does not match release version')"

      - name: Create Archive
        run: |
          package_dir='gatekeeper-headlamp-plugin'
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp -a .plugins/. "$package_dir/"
          find "$package_dir" -exec touch -h --date='@0' {} +
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=ustar \
            --create \
            --file=- \
            "$package_dir" | gzip --no-name > "$RELEASE_TAR"

      - name: Calculate Checksum
        id: checksum
        run: |
          checksum="$(sha256sum "$RELEASE_TAR" | cut -d' ' -f1)"
          echo "value=$checksum" >> "$GITHUB_OUTPUT"

      - name: Verify Artifact Hub metadata
        env:
          EXPECTED_CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const metadata = yaml.load(fs.readFileSync('artifacthub-pkg.yml', 'utf8'));
          const expectedArchiveUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_VERSION}/${process.env.RELEASE_TAR}`;
          const expectedChecksum = `SHA256:${process.env.EXPECTED_CHECKSUM}`;

          if (
            metadata.version !== process.env.RELEASE_VERSION ||
            metadata.digest !== process.env.EXPECTED_CHECKSUM ||
            metadata.prerelease !== true ||
            typeof metadata.createdAt !== 'string' ||
            Number.isNaN(Date.parse(metadata.createdAt)) ||
            metadata.annotations?.['headlamp/plugin/archive-url'] !== expectedArchiveUrl ||
            metadata.annotations?.['headlamp/plugin/archive-checksum'] !== expectedChecksum
          ) {
            throw new Error('Artifact Hub metadata does not match the release archive');
          }
          NODE

      - name: Check for existing release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub prerelease
        if: steps.existing_release.outputs.value != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release_version.outputs.value }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ steps.release_version.outputs.archive }}
          token: ${{ github.token }}

      - name: Verify public release archive
        env:
          EXPECTED_CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: |
          archive_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_VERSION/$RELEASE_TAR"
          mkdir -p release-verification
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --output release-verification/archive.tar.gz \
            "$archive_url"
          echo "$EXPECTED_CHECKSUM  release-verification/archive.tar.gz" | sha256sum --check
          tar -xzf release-verification/archive.tar.gz -C release-verification
          RELEASE_PACKAGE="release-verification/gatekeeper-headlamp-plugin/package.json" node <<'NODE'
          const packageJson = require(`./${process.env.RELEASE_PACKAGE}`);
          if (packageJson.version !== process.env.RELEASE_VERSION) {
            throw new Error(`Published plugin version ${packageJson.version} does not match ${process.env.RELEASE_VERSION}`);
          }
          NODE
